# dsh-free-search-fork-for-dsht — 本地独立 fork（不再追踪上游 DDDMUC/dsh-free-search）
# Registers the plugin into ctx.web + a settings bridge served at
# /api/free-search-fork-settings.
# The engine is chosen from the sidebar Plugins page -> Free Search row config
# (plugins.row.config, DSH 0.1.7-rc.1+), from the /free-search-engine command,
# or directly via this entry's config, e.g.:
#   provider: bing        # engine id: ddg / bing / baidu / kimi / aliyun / doubao / openai / gemini / claude / auto / multi / ...
#   region: cn-zh         # DuckDuckGo region
#   bingMarket: ja-JP     # Bing market
# A legacy ~/.dsh/settings.yaml "free-search:" section is migrated into this
# entry's config once at startup (see README).
# Failed/empty engines automatically fall back to the next free engine.
#
# NOTE: this is a LOCAL FORK. It does NOT track the upstream DDDMUC/dsh-free-search
# package. The npm-registry version check and the self-reinstall command have been
# repointed so they never pull the upstream package.
#
# ─────────────────────────────────────────────────────────────────────────────
# 本 config 与运行时 config.json **逐字完全一致**（2026-10-18 快照复制）。
# 用户要求：不可省略、不可变更。因此连本机代理地址 127.0.0.1:10808、
# 34 个 searxngEngines、legacyYamlMigrated:false 等均原样写入，字段顺序亦一致。
# 换机器 / 换代理时，删除运行时的 config.json 并不会回退到“干净默认”——
# 这里就是默认，需自行在设置页调整。
# ─────────────────────────────────────────────────────────────────────────────
- insert:
    - id: web-search-free-fork
      name: dsh-free-search-fork-for-dsht
      config:
        provider: auto
        disabledEngines: []
        disabledTools:
          - weather
          - video_search
          - platform_search
          - domain_search
          - advanced_search
          - multi_search
          - free_search_test
        webFetchEnabled: false
        fallbackOrder:
          - exa
          - tavily
          - searxng
          - keenable
          - anysearch
          - ddg-lite
          - firecrawl
          - ddg
          - bing
          - parallel
          - perplexity
          - serpbase
          - serply
          - deepseek-official
          - you
          - baidu
          - kimi
          - aliyun
          - doubao
          - tinyfish
          - jina
          - zhihu_global
          - zhihu_site
        fallbackOn:
          - quota
          - auth
          - bot-wall
          - transient
          - invalid-response
          - unknown
        blockedDomains: []
        cache: true
        cacheTtl: 5
        multiMaxEngines: 6
        multiMinSources: 2
        keyStorage: settings
        lang: zh
        bingMarket: ja-JP
        safeSearch: off
        searxngInstances:
          - "https://search.mectov.my.id"
        searxngEngines:
          - yacy
          - wikidata
          - "duckduckgo web"
          - gmx
          - yandex
          - zapmeta
          - "360search"
          - wiby
          - fynd
          - wikimini
          - reloado
          - openlibrary
          - ayo
          - mwmbl
          - tagesschau
          - encyclosearch
          - searchch
          - naver
          - quark
          - wikivoyage
          - wikispecies
          - wikisource
          - wikiquote
          - yep
          - boardreader
          - bpb
          - wikibooks
          - yahoo
          - bing
          - "ddg definitions"
          - crowview
          - wikipedia
        platforms:
          - github
          - v2ex
          - bilibili
          - reddit
          - hn
          - stackoverflow
          - wikipedia
          - npm
          - youtube
          - vimeo
          - juejin
          - douban
          - qiita
        zhPool:
          - exa
          - tavily
          - searxng
          - keenable
          - anysearch
          - ddg-lite
          - bing
          - firecrawl
        enPool:
          - exa
          - tavily
          - searxng
          - keenable
          - anysearch
          - ddg-lite
          - bing
          - firecrawl
        defaultProxyEnabled: false
        defaultProxyUrl: ""
        proxyByEngine:
          ddg: "http://127.0.0.1:10808"
          ddg-lite: "http://127.0.0.1:10808"
        proxyByTool:
          platform_search: "http://127.0.0.1:10808"
          domain_search: "http://127.0.0.1:10808"
          research: "http://127.0.0.1:10808"
        escalationEngines: []
        legacyYamlMigrated: false
